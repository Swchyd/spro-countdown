<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPro Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPro Countdown">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --stage: #0B0D12;
    --panel: #161A22;
    --panel-2: #1E2430;
    --line: #2A3140;
    --ink: #F0EEE8;
    --ink-dim: #9AA3B2;
    --accent: #E3A44A;
    --bright: #FFD60A;
    --over: #E25C4A;
    --ok: #4ADE80;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- screens ---------- */
  .screen { display: none; height: 100%; }
  .screen.on { display: flex; }

  #menu, #setup, #join {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: auto 0;
  }
  #setup .card, #menu .card { margin: 0; }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 8px;
  }
  .brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .01em;
    margin: 0;
  }
  .brand .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--over);
    align-self: center;
    box-shadow: 0 0 8px rgba(226,92,74,.7);
  }
  label.field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 7px;
  }
  /* ---------- mode menu ---------- */
  .mode-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 18px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: border-color .2s, background .2s;
  }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn:active { background: var(--panel-2); }

  /* ---------- shared form bits ---------- */
  .textinput {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    padding: 14px 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-family: inherit;
    resize: none;
    line-height: 1.3;
  }
  .textinput::placeholder { color: #5B6474; font-weight: 500; }

  .title-wrap { position: relative; }
  .title-wrap .textinput { padding-right: 106px; }
  .bank-toggle, .bank-add {
    position: absolute;
    top: 6px;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--ink-dim);
    font-size: 16px;
    transition: transform .2s;
  }
  .bank-toggle { right: 6px; }
  .bank-add { right: 56px; font-size: 20px; }
  .bank-add.saved { color: var(--accent); }
  .bank-toggle:active, .bank-add:active { background: var(--line); }
  .title-wrap.open .bank-toggle { transform: rotate(180deg); color: var(--accent); }
  .bank-list {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 42vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    z-index: 10;
  }
  .title-wrap.open .bank-list { display: block; }
  .bank-item {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .bank-item.dragging {
    background: var(--panel);
    opacity: .92;
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
    position: relative;
    z-index: 5;
    border-radius: 10px;
  }
  .bank-item:last-child { border-bottom: none; }
  .bank-item .pick {
    flex: 1;
    text-align: left;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: pre-line;
    min-width: 0;
  }
  .bank-item .pick:active { background: var(--line); }
  .bank-item .pick.active { color: var(--accent); }
  .bank-item .del {
    flex: 0 0 44px;
    height: 44px;
    margin-right: 4px;
    border-radius: 10px;
    color: var(--ink-dim);
    font-size: 16px;
  }
  .bank-item .del:active { background: var(--line); color: var(--over); }
  .bank-empty {
    padding: 16px;
    font-size: 13px;
    color: var(--ink-dim);
    text-align: center;
  }

  .settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .setting {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .stepper button {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--panel-2);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
  }
  .stepper button:active { background: var(--line); }
  .stepper .val {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    flex: 1;
  }
  .stepper .val input {
    width: 100%;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 2px 0;
  }
  .stepper .val input:focus { background: var(--panel-2); }
  .stepper .val small {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-dim);
  }
  .primary {
    padding: 18px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #1A1408;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .primary:active { filter: brightness(.92); }
  .ghost {
    padding: 14px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
  }
  .ghost:active { background: var(--panel-2); }
  #setupClock {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
    color: var(--bright);
  }

  /* ---------- room code chip ---------- */
  .room-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .room-row .rl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .room-code {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .28em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    margin-right: auto;
    padding-left: 4px;
  }
  .room-row .ghost { padding: 9px 12px; font-size: 12px; }

  [hidden] { display: none !important; }
  .mode-btn:disabled { opacity: .45; cursor: default; }

  .url-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .url-row .rl {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .url-item {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    line-height: 1.35;
  }
  .url-none { font-size: 13px; color: var(--over); line-height: 1.5; }

  .link-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .link-status .led {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ink-dim);
    flex: 0 0 auto;
    transition: background .25s, box-shadow .25s;
  }
  .link-status.live .led { background: var(--ok); box-shadow: 0 0 8px rgba(74,222,128,.7); }
  .link-status.warn .led { background: var(--accent); box-shadow: 0 0 8px rgba(227,164,74,.7); }
  .link-status.down .led { background: var(--over); box-shadow: 0 0 8px rgba(226,92,74,.7); }

  /* ---------- join screen (iPad) ---------- */
  #codeInput {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    padding: 18px 16px;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: .38em;
    text-indent: .38em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
  }
  #codeInput::placeholder { color: #3A4252; letter-spacing: .38em; }

  /* ---------- the stage (mirrored on both devices) ---------- */
  .stage-wrap {
    container-type: size;
    position: relative;
    background: var(--stage);
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  #labelZone {
    flex: 0 0 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2cqh 4cqw 0;
    min-height: 0;
  }
  #labelText {
    font-size: min(8.5cqw, 11cqh);
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    text-wrap: balance;
    white-space: pre-line;
    line-height: 1.15;
  }
  #clock {
    position: absolute;
    top: 2cqh;
    right: 2.5cqw;
    z-index: 3;
    font-size: min(5cqw, 6.5cqh);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
    color: var(--bright);
  }
  #timeZone {
    flex: 1 1 75%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  #timeText {
    font-size: min(29cqw, 54cqh);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    line-height: 1;
    color: var(--bright);
    transition: color .3s;
  }
  #timeText.over {
    color: var(--over);
    animation: overPulse 1s ease-in-out infinite;
  }
  #timeText .plus { font-size: .55em; vertical-align: .28em; margin-right: .04em; }
  @keyframes overPulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    #timeText.over { animation: none; }
  }

  /* swapped: title fills the middle, countdown small on top */
  #stage.swapped #timeZone {
    order: -1;
    flex: 0 0 25%;
    padding-top: 2cqh;
  }
  #stage.swapped #timeText { font-size: min(10cqw, 15cqh); }
  #stage.swapped #labelZone { flex: 1 1 75%; padding: 0 4cqw; }
  #stage.swapped #labelText {
    font-size: min(5.8cqw, 10cqh); /* ~20 uppercase characters per line */
    letter-spacing: .08em;
  }

  /* standby (display connected, operator has not started yet) */
  #stage.standby #labelZone, #stage.standby #timeZone { visibility: hidden; }
  #standby {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2cqh;
    text-align: center;
    padding: 4cqw;
  }
  #stage.standby #standby { display: flex; }
  #standby .big {
    font-size: min(6cqw, 9cqh);
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  #standby .sub { font-size: min(2.6cqw, 4cqh); color: #5B6474; letter-spacing: .1em; }

  /* attention flash (red/blue) */
  #stage.flashing { animation: flashRB .8s linear infinite; }
  @keyframes flashRB {
    0%, 49% { background-color: #B30E1E; }
    50%, 100% { background-color: #1440C4; }
  }
  #stage.flashing #timeText, #stage.flashing #timeText.over {
    color: #FFFFFF;
    animation: none;
  }

  /* stage as the whole screen (display device / fullscreen) */
  #stageWrap.full {
    position: fixed;
    inset: 0;
    height: 100%;
    z-index: 50;
  }
  #stageWrap.full #labelZone { padding-top: max(2cqh, env(safe-area-inset-top)); }
  #stageWrap.full #clock { top: max(2cqh, env(safe-area-inset-top)); }

  /* ---------- standalone chrome (iPad drives itself) ---------- */
  #soloOverlay {
    position: fixed;
    inset: 0;
    z-index: 55;
    display: none;
    pointer-events: none;
  }
  #soloOverlay.on { display: block; }
  #soloOverlay > * { pointer-events: auto; }

  #controls.floating {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    flex-wrap: nowrap;
    background: rgba(22,26,34,.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: .35;
    transition: opacity .25s;
  }
  #controls.floating:hover,
  #soloOverlay.paused #controls.floating { opacity: 1; }

  #soloExit {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 14px;
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    background: rgba(22,26,34,.88);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    opacity: .35;
    transition: opacity .25s;
  }
  #soloExit:hover, #soloOverlay.paused #soloExit { opacity: 1; }

  #pausedBadge {
    position: fixed;
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + 86px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(22,26,34,.88);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    display: none;
  }
  #soloOverlay.paused #pausedBadge { display: block; }

  #drawer {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translate(100%, -50%);
    transition: transform .3s ease;
    display: flex;
  }
  #drawer.open { transform: translate(0, -50%); }
  #drawerTab {
    position: absolute;
    left: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 72px;
    background: rgba(22,26,34,.88);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 12px 0 0 12px;
    color: var(--ink-dim);
    font-size: 22px;
    opacity: .35;
    transition: opacity .25s;
  }
  #drawerTab:hover, #drawer.open #drawerTab, #soloOverlay.paused #drawerTab { opacity: 1; }
  #drawerBody {
    width: 300px;
    max-height: 84vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--panel);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: var(--radius) 0 0 var(--radius);
    padding: 12px;
  }
  #drawerBody .op-grid { max-width: none; gap: 12px; }

  /* the drawer is narrower than the media query can see */
  .op-grid.stacked { grid-template-columns: 1fr; }

  /* ---------- edit the title straight off the stage ---------- */
  #labelEdit {
    display: none;
    width: 92%;
    max-height: 100%;
    font-size: min(8.5cqw, 11cqh);
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    line-height: 1.15;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: .05em .2em;
    font-family: inherit;
    resize: none;
    overflow-y: auto;
  }
  #labelZone.editing #labelText { display: none; }
  #labelZone.editing #labelEdit { display: block; }
  #stage.swapped #labelEdit { font-size: min(5.8cqw, 10cqh); letter-spacing: .08em; }
  body.solo-mode #labelText { cursor: pointer; }

  /* ---------- display device chrome ---------- */
  #dispBar {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 14px;
    z-index: 60;
    display: none;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    background: rgba(22,26,34,.88);
    border: 1px solid var(--line);
    font-size: 12.5px;
    opacity: .28;
    transition: opacity .25s;
  }
  #dispBar:hover, #dispBar.alert { opacity: 1; }
  body.display-mode #dispBar { display: flex; }
  #dispExit {
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
    padding-left: 10px;
    margin-left: 2px;
    border-left: 1px solid var(--line);
  }

  /* ---------- operator console ---------- */
  #opScreen { flex-direction: column; padding: 0; }
  #opHead {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  #opHead .brand { margin: 0; }
  #opHead .spacer { flex: 1 1 auto; }
  #opHead .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  #opHead .chip b {
    color: var(--accent);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .2em;
    font-variant-numeric: tabular-nums;
  }
  #opClock {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
    color: var(--bright);
  }
  #opExit {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #opExit:active { background: var(--panel-2); color: var(--over); }

  #opBody {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 16px 16px 32px;
  }
  #previewBox {
    width: 100%;
    max-width: 620px;
    aspect-ratio: 4 / 3;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px;
  }
  #controls button {
    min-width: 60px;
    height: 60px;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 0 12px;
  }
  #controls button:active { background: var(--panel-2); }
  #controls button small {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  #playBtn {
    background: var(--accent) !important;
    color: #1A1408 !important;
    min-width: 76px !important;
    font-size: 26px !important;
  }
  #flashBtn.on { background: var(--over); color: #fff; }
  #flashBtn.on small { color: rgba(255,255,255,.8); }

  .op-grid {
    width: 100%;
    max-width: 620px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 620px) { .op-grid { grid-template-columns: 1fr; } }
  .op-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .op-panel .textinput { font-size: 16px; padding: 12px 14px; }
  .op-panel .title-wrap .textinput { padding-right: 100px; }
  .op-panel .bank-toggle, .op-panel .bank-add { top: 4px; width: 42px; height: 42px; }
  .op-panel .bank-add { right: 52px; }
  .op-panel .stepper button { width: 40px; height: 40px; font-size: 18px; }
  #applyTimeBtn { padding: 13px; font-size: 14px; letter-spacing: .04em; }
</style>
</head>

<!-- ============ the mirrored stage (moved into preview or fullscreen) ============ -->
<div id="stageWrap" class="stage-wrap" style="display:none">

<!-- ============ standalone chrome, laid over the fullscreen stage ============ -->

<div id="dispBar">
  <span class="link-status" id="dispLink"><span class="led"></span><span class="txt"></span></span>
  <button type="button" id="dispExit" aria-label="Exit">✕</button>

<script src="peerjs.min.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

(function () {
  "use strict";

  var LS_KEY = "stagetimer-v1";
  var PEER_PREFIX = "spro-countdown-v2-";

  // ----- persisted config -----
  var cfg = {
    label: "",
    minutes: 10,
    seconds: 0,
    bank: [],        // saved titles, in the order they were added
    room: "",        // operator's own room code
    join: ""         // last room code this display joined
  };

  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (saved && typeof saved === "object") {
      for (var k in cfg) if (k in saved) cfg[k] = saved[k];
    }
  } catch (e) {}
  if (!Array.isArray(cfg.bank)) cfg.bank = [];

  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };

  // ============================================================
  //  Timer model
  //
  //  The operator owns the truth. What travels over the wire is not a
  //  ticking number but a deadline: `endAt` is the wall-clock instant the
  //  countdown reaches zero. Each device renders from its own clock, so the
  //  display never waits on a packet to update — and it keeps counting
  //  correctly even if the link drops mid-service.
  // ============================================================
  var T = {
    live: false,        // timer screen is showing (vs. standby)
    playing: false,
    totalMs: 600000,    // configured duration, used by Restart
    remainMs: 600000,   // authoritative while paused
    endAt: 0,           // authoritative while playing (epoch ms)
    label: "",
    swapped: false,
    flashing: false
  };

  var clockOffset = 0;  // display: add to Date.now() to match the operator
  function now() { return Date.now() + clockOffset; }

  function remainingMs() {
    return T.playing ? T.endAt - now() : T.remainMs;
  }

  function snapshot() {
    return {
      live: T.live, playing: T.playing, totalMs: T.totalMs,
      remainMs: T.remainMs, endAt: T.endAt, label: T.label,
      swapped: T.swapped, flashing: T.flashing
    };
  }

  // ============================================================
  //  Stage rendering — identical code drives the iPad and the preview
  // ============================================================
  var stageWrap = $("stageWrap"), stage = $("stage");
  var labelText = $("labelText"), timeText = $("timeText"), clockEl = $("clock");
  var shownTime = "", shownClock = "", shownLabel = null;

  function fmt(totalSec) {
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function nowHMS() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  function renderStage() {
    stage.classList.toggle("swapped", !!T.swapped);
    stage.classList.toggle("flashing", !!T.flashing);
    stage.classList.toggle("standby", !T.live);

    if (T.label !== shownLabel) {
      shownLabel = T.label;
      labelText.textContent = T.label;
    }

    var remain = remainingMs();
    var over = remain <= 0;
    var txt = over ? "+" + fmt(Math.floor(-remain / 1000)) : fmt(Math.ceil(remain / 1000));
    if (txt !== shownTime) {
      shownTime = txt;
      if (over) {
        timeText.innerHTML = '<span class="plus">−</span>' + txt.slice(1);
        timeText.classList.add("over");
      } else {
        timeText.textContent = txt;
        timeText.classList.remove("over");
      }
    }

    var t = nowHMS();
    if (t !== shownClock) {
      shownClock = t;
      clockEl.textContent = t;
      if (opClockEl) opClockEl.textContent = t;
      if (setupClockEl) setupClockEl.textContent = t;
      if (setupClockEl2) setupClockEl2.textContent = t;
    }
  }

  // 4 ticks/s is plenty for a once-per-second display and lets the CPU idle.
  setInterval(renderStage, 250);

  var opClockEl = $("opClock");
  var setupClockEl = $("setupClock"), setupClockEl2 = $("setupClock2");

  function mountStage(parent, full) {
    parent.appendChild(stage);
    stageWrap.style.display = full ? "" : "none";
    shownTime = ""; shownClock = ""; shownLabel = null;
    renderStage();
  }

  // ============================================================
  //  Link — PeerJS data channel, operator hosts, displays connect in
  // ============================================================
  //  Two transports, picked automatically at boot:
  //
  //  LOCAL  — the page came from the stage server on this network, so state
  //           goes over plain HTTP + Server-Sent Events. No internet at all.
  //  CLOUD  — the page came from GitHub Pages, so devices pair through a
  //           PeerJS room code and talk peer-to-peer.
  var LOCAL = false;
  var localPeers = 0;    // displays connected, reported by the stage server
  var localES = null;    // EventSource, both roles
  var peer = null;
  var conns = [];        // operator: every connected display
  var dispConn = null;   // display: the one link home
  var role = "";         // "op" | "display"
  var linkState = "";    // "", "connecting", "ready", "linked", "lost", "error"
  var linkNote = "";
  var retryTimer = 0;

  function setLink(stateName, note) {
    linkState = stateName;
    linkNote = note || "";
    renderLink();
  }

  function renderLink() {
    var cls = "", txt = linkNote;
    if (role === "op") {
      if (linkState === "ready") {
        var n = LOCAL ? localPeers : conns.length;
        cls = n ? "live" : "warn";
        txt = n ? (n + (n === 1 ? " display connected" : " displays connected")) : "Waiting for a display";
      } else if (linkState === "connecting") { cls = "warn"; txt = txt || "Connecting…"; }
      else if (linkState === "error") { cls = "down"; }
    } else {
      if (linkState === "linked") { cls = "live"; txt = txt || "Connected"; }
      else if (linkState === "connecting") { cls = "warn"; txt = txt || "Connecting…"; }
      else if (linkState === "lost") { cls = "down"; txt = txt || "Link lost — timer still running"; }
      else if (linkState === "error") { cls = "down"; }
    }
    ["opLink1", "opLink2", "joinLink", "dispLink"].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.className = "link-status" + (cls ? " " + cls : "");
      el.querySelector(".txt").textContent = txt;
    });
    var bar = $("dispBar");
    if (bar) bar.classList.toggle("alert", cls === "down" || cls === "warn");
    if (role === "display") $("standbySub").textContent = txt;
  }

  function havePeerJS() { return typeof Peer !== "undefined"; }

  function randomRoom() {
    return String(Math.floor(1000 + Math.random() * 9000));
  }

  function destroyPeer() {
    clearTimeout(retryTimer);
    conns = [];
    dispConn = null;
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  }

  function closeLink() {
    destroyPeer();
    clearInterval(pingTimer);
    clearInterval(localSyncTimer);
    localPeers = 0;
    if (localES) { try { localES.close(); } catch (e) {} localES = null; }
  }

  // ---- local transport (stage server on this network) ----
  var localSyncTimer = 0;

  // Is a stage server answering on this origin? Decides the transport.
  function detectLocal(done) {
    if (/\.github\.io$/i.test(location.hostname) || location.protocol === "file:") {
      done(false);
      return;
    }
    var settled = false;
    var give = function (v) { if (!settled) { settled = true; clearTimeout(t); done(v); } };
    var t = setTimeout(function () { give(false); }, 2000);
    fetch("time", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) { give(typeof j.s === "number"); })
      .catch(function () { give(false); });
  }

  // One clock-offset sample; keeps the least-delayed of the last few.
  function sampleServerClock() {
    var t0 = Date.now();
    fetch("time", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var rtt = Date.now() - t0;
        absorbSample(rtt, j.s + rtt / 2 - Date.now());
      })
      .catch(function () {});
  }

  function burstSync(n) {
    var i = 0;
    var step = function () {
      if (i++ >= n) return;
      sampleServerClock();
      setTimeout(step, 150);
    };
    step();
  }

  function openLocalStream(asRole, onState) {
    if (localES) { try { localES.close(); } catch (e) {} }
    var es = new EventSource("events?role=" + asRole);
    localES = es;

    es.onopen = function () {
      setLink(asRole === "op" ? "ready" : "linked");
    };

    es.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "peers") { localPeers = m.n; renderLink(); }
      else if (m.t === "state" && onState) onState(m.d);
    };

    // EventSource reconnects on its own; just reflect the state.
    es.onerror = function () {
      if (localES !== es) return;
      setLink(asRole === "op" ? "connecting" : "lost");
    };
  }

  function hostLocal() {
    closeLink();
    setLink("connecting", "Starting…");
    // Deadlines are written in server time, so the operator syncs too — this
    // stays correct even if the console is opened from a second machine.
    burstSync(5);
    clearInterval(localSyncTimer);
    localSyncTimer = setInterval(sampleServerClock, 30000);
    openLocalStream("op", null);
    fetch("info", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { showDisplayURL(j.urls || []); })
      .catch(function () {});
  }

  function joinLocal() {
    closeLink();
    setLink("connecting");
    burstSync(5);
    clearInterval(localSyncTimer);
    localSyncTimer = setInterval(sampleServerClock, 30000);
    openLocalStream("display", applyState);
  }

  function pushLocal() {
    fetch("state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(snapshot())
    }).catch(function () {});
  }

  // ---- operator side ----
  function broadcast() {
    if (role === "solo") return;   // nothing to talk to
    if (LOCAL) { pushLocal(); return; }
    var msg = JSON.stringify({ t: "s", d: snapshot() });
    conns.forEach(function (c) {
      if (c.open) { try { c.send(msg); } catch (e) {} }
    });
  }

  function hostRoom(code, isRetry) {
    destroyPeer();
    if (!havePeerJS()) {
      setLink("error", "Connection module failed to load — reload the page.");
      return;
    }
    cfg.room = code;
    persist();
    $("roomCode").textContent = code;
    $("opRoomCode").textContent = code;
    setLink("connecting", "Connecting…");

    peer = new Peer(PEER_PREFIX + code, { debug: 0 });

    peer.on("open", function () { setLink("ready"); });

    peer.on("connection", function (conn) {
      conn.on("open", function () {
        conns.push(conn);
        renderLink();
        try { conn.send(JSON.stringify({ t: "s", d: snapshot() })); } catch (e) {}
      });
      conn.on("data", function (raw) {
        var m;
        try { m = JSON.parse(raw); } catch (e) { return; }
        if (m.t === "ping") {
          try { conn.send(JSON.stringify({ t: "pong", c: m.c, s: Date.now() })); } catch (e) {}
        } else if (m.t === "hello") {
          try { conn.send(JSON.stringify({ t: "s", d: snapshot() })); } catch (e) {}
        }
      });
      var drop = function () {
        conns = conns.filter(function (c) { return c !== conn; });
        renderLink();
      };
      conn.on("close", drop);
      conn.on("error", drop);
    });

    peer.on("error", function (err) {
      if (err && err.type === "unavailable-id") {
        // Someone (possibly a stale session of ours) holds this code.
        if (isRetry) {
          setLink("error", "Code " + code + " is already in use — pick a new code.");
        } else {
          retryTimer = setTimeout(function () { hostRoom(code, true); }, 1500);
          setLink("connecting", "Reclaiming code…");
        }
      } else if (err && err.type === "network") {
        setLink("error", "Signalling server unreachable — retrying…");
        retryTimer = setTimeout(function () { hostRoom(code, false); }, 4000);
      } else if (err && err.type !== "peer-unavailable") {
        setLink("error", "Connection error: " + (err.type || "unknown"));
      }
    });

    peer.on("disconnected", function () {
      if (peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} }
    });
  }

  // ---- display side ----
  var pingTimer = 0, syncSamples = [];

  function sendPing() {
    if (!dispConn || !dispConn.open) return;
    try { dispConn.send(JSON.stringify({ t: "ping", c: Date.now() })); } catch (e) {}
  }

  function absorbSample(rtt, offset) {
    syncSamples.push({ rtt: rtt, offset: offset });
    if (syncSamples.length > 8) syncSamples.shift();
    // The lowest-latency sample is the least distorted one.
    var best = syncSamples[0];
    syncSamples.forEach(function (s) { if (s.rtt < best.rtt) best = s; });
    clockOffset = best.offset;
  }

  function absorbPong(m) {
    var rtt = Date.now() - m.c;
    // Standard NTP estimate: assume the trip is symmetric.
    absorbSample(rtt, m.s + rtt / 2 - Date.now());
  }

  function applyState(d) {
    for (var key in d) if (key in T) T[key] = d[key];
    renderStage();
  }

  function joinRoom(code) {
    destroyPeer();
    if (!havePeerJS()) {
      setLink("error", "Connection module failed to load — reload the page.");
      return;
    }
    cfg.join = code;
    persist();
    setLink("connecting", "Connecting to room " + code + "…");

    peer = new Peer({ debug: 0 });

    peer.on("open", function () { openConn(code); });

    peer.on("error", function (err) {
      if (err && err.type === "peer-unavailable") {
        setLink("connecting", "Room " + code + " is not live yet — waiting…");
        clearTimeout(retryTimer);
        retryTimer = setTimeout(function () { openConn(code); }, 3000);
      } else if (err && err.type === "network") {
        setLink("lost", "Signalling server unreachable — retrying…");
        clearTimeout(retryTimer);
        retryTimer = setTimeout(function () { joinRoom(code); }, 4000);
      } else if (err) {
        setLink("error", "Connection error: " + (err.type || "unknown"));
      }
    });

    peer.on("disconnected", function () {
      if (peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} }
    });
  }

  function openConn(code) {
    if (!peer || peer.destroyed) return;
    var conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    if (!conn) return;
    dispConn = conn;

    conn.on("open", function () {
      setLink("linked");
      syncSamples = [];
      try { conn.send(JSON.stringify({ t: "hello" })); } catch (e) {}
      // A quick burst first, then a slow keep-honest ping.
      var burst = 0;
      var b = setInterval(function () {
        sendPing();
        if (++burst >= 5) clearInterval(b);
      }, 200);
      clearInterval(pingTimer);
      pingTimer = setInterval(sendPing, 20000);
    });

    conn.on("data", function (raw) {
      var m;
      try { m = JSON.parse(raw); } catch (e) { return; }
      if (m.t === "s") {
        applyState(m.d);
      } else if (m.t === "pong") {
        absorbPong(m);
      }
    });

    var lost = function () {
      // A stale link closing must not tear down the one that replaced it.
      if (dispConn !== conn) return;
      clearInterval(pingTimer);
      dispConn = null;
      setLink("lost");
      clearTimeout(retryTimer);
      retryTimer = setTimeout(function () { openConn(code); }, 2000);
    };
    conn.on("close", lost);
    conn.on("error", lost);
  }

  // ============================================================
  //  Screens
  // ============================================================
  function show(id) {
    ["menu", "setup", "join", "opScreen"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }

  function goMenu() {
    closeLink();
    if (document.body.classList.contains("solo-mode")) leaveSolo();
    role = "";
    linkState = "";
    document.body.classList.remove("display-mode");
    stageWrap.classList.remove("full");
    stageWrap.style.display = "none";
    releaseWakeLock();
    show("menu");
  }

  $("pickOp").addEventListener("click", function () {
    role = "op";
    show("setup");
    renderSetup();
    applyTransportUI();
    if (LOCAL) hostLocal();
    else hostRoom(cfg.room || randomRoom(), false);
  });

  // Standalone needs no link at all — one device does everything.
  $("pickSolo").addEventListener("click", function () {
    role = "solo";
    closeLink();
    setLink("", "");
    show("setup");
    renderSetup();
    $("roomRow").hidden = true;
    $("urlRow").hidden = true;
  });

  // On a local network there is nothing to pair — the server already knows
  // both devices, so the display goes straight to the stage.
  $("pickDisp").addEventListener("click", function () {
    role = "display";
    if (LOCAL) { enterDisplay(); joinLocal(); return; }
    show("join");
    $("codeInput").value = cfg.join || "";
    setLink("", "");
  });

  function enterDisplay() {
    document.body.classList.add("display-mode");
    stageWrap.classList.add("full");
    show("");
    mountStage(stageWrap, true);
    T.live = false;
    requestWakeLock();
  }

  $("setupBack").addEventListener("click", goMenu);
  $("joinBack").addEventListener("click", goMenu);

  // ----- display: join flow -----
  var codeInput = $("codeInput");
  codeInput.addEventListener("input", function () {
    var v = codeInput.value.replace(/\D/g, "").slice(0, 4);
    if (v !== codeInput.value) codeInput.value = v;
  });
  codeInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("joinBtn").click();
  });

  $("joinBtn").addEventListener("click", function () {
    var code = codeInput.value.replace(/\D/g, "");
    if (code.length !== 4) {
      setLink("error", "Enter the 4-digit room code.");
      return;
    }
    enterDisplay();
    joinRoom(code);
  });

  $("dispExit").addEventListener("click", goMenu);

  // ============================================================
  //  Operator: setup screen
  // ============================================================
  var labelInput = $("labelInput"), minVal = $("minVal"), secVal = $("secVal");
  labelInput.value = cfg.label;

  function renderSetup() {
    minVal.value = cfg.minutes;
    secVal.value = pad2(cfg.seconds);
    labelInput.value = cfg.label;
  }

  document.querySelectorAll("[data-step]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var d = Number(btn.dataset.d);
      if (btn.dataset.step === "min") cfg.minutes = Math.min(180, Math.max(0, cfg.minutes + d));
      if (btn.dataset.step === "sec") cfg.seconds = (cfg.seconds + d * 5 + 60) % 60;
      renderSetup(); persist();
    });
  });

  // typed input: digits only while typing; clamp and save when done
  function wireTypedValue(input, max, commit) {
    input.addEventListener("focus", function () { input.select(); });
    input.addEventListener("input", function () {
      var v = input.value.replace(/\D/g, "");
      if (v !== input.value) input.value = v;
      if (v !== "") commit(Math.min(max, Number(v)));
    });
    input.addEventListener("blur", function () { renderSetup(); persist(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") input.blur();
    });
  }
  wireTypedValue(minVal, 180, function (v) { cfg.minutes = v; });
  wireTypedValue(secVal, 59, function (v) { cfg.seconds = v; });

  labelInput.addEventListener("input", function () {
    cfg.label = labelInput.value;
    persist();
  });

  $("newRoomBtn").addEventListener("click", function () {
    hostRoom(randomRoom(), false);
  });

  // ============================================================
  //  Title bank — shared by the setup screen and the console
  // ============================================================
  function saveToBank(title) {
    title = (title || "").trim();
    if (!title) return;
    // Already saved? Leave it where it sits — the order the operator
    // built by hand matters more than recency.
    var exists = cfg.bank.some(function (t) {
      return t.toUpperCase() === title.toUpperCase();
    });
    if (exists) return;
    cfg.bank.push(title);                          // newest goes to the bottom
    if (cfg.bank.length > 30) cfg.bank.shift();    // cap drops the oldest
    persist();
  }

  // touch: long-press (0.4 s) a bank row, then drag up/down to reorder
  // mouse: press and drag right away
  function enableReorder(container, onDone) {
    var pressTimer = 0, dragRow = null, pendingRow = null, active = false;
    var startY = 0, isMouse = false;

    function cancelPress() { clearTimeout(pressTimer); }

    function activate() {
      cancelPress();
      active = true;
      dragRow = pendingRow;
      dragRow.classList.add("dragging");
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function onMove(e) {
      if (!active) {
        if (Math.abs(e.clientY - startY) > 8) {
          if (isMouse) activate();          // mouse drags immediately
          else { cancelPress(); return; }   // touch move = scroll
        } else {
          return;
        }
      }
      var rows = Array.prototype.filter.call(container.children, function (el) {
        return el !== dragRow && el.classList.contains("bank-item");
      });
      var placed = false;
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) {
          container.insertBefore(dragRow, rows[i]);
          placed = true;
          break;
        }
      }
      if (!placed) container.appendChild(dragRow);
    }

    function onUp() {
      cancelPress();
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!active) return;
      active = false;
      dragRow.classList.remove("dragging");
      dragRow = null;
      pendingRow = null;
      // save the new order as it now stands in the DOM
      cfg.bank = Array.prototype.map.call(
        container.querySelectorAll(".bank-item"),
        function (el) { return el.dataset.title; }
      );
      persist();
      if (onDone) onDone();
      // swallow the click that follows the drop so it doesn't pick a title
      container.addEventListener("click", function (e) {
        e.stopPropagation(); e.preventDefault();
      }, { capture: true, once: true });
    }

    container.addEventListener("pointerdown", function (e) {
      var row = e.target.closest ? e.target.closest(".bank-item") : null;
      if (!row) return;
      startY = e.clientY;
      isMouse = e.pointerType === "mouse";
      pendingRow = row;
      cancelPress();
      pressTimer = setTimeout(activate, 400);
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    // while dragging, stop the list (and page) from scrolling under the finger
    container.addEventListener("touchmove", function (e) {
      if (active) e.preventDefault();
    }, { passive: false });
  }

  // wires one title field: textarea + save + dropdown + reorderable list.
  // opts: { onPick, isActive, closeOnPick }
  function makeTitleField(wrap, input, list, addBtn, toggleBtn, opts) {
    function render() {
      list.textContent = "";
      if (!cfg.bank.length) {
        var empty = document.createElement("div");
        empty.className = "bank-empty";
        empty.textContent = "No saved titles yet.";
        list.appendChild(empty);
        return;
      }
      cfg.bank.forEach(function (title) {
        var row = document.createElement("div");
        row.className = "bank-item";
        row.dataset.title = title;

        var pick = document.createElement("button");
        pick.type = "button";
        pick.className = "pick" + (opts.isActive && opts.isActive(title) ? " active" : "");
        pick.textContent = title;
        pick.addEventListener("click", function (e) {
          e.stopPropagation();
          input.value = title;
          opts.onPick(title);
          if (opts.closeOnPick) setOpen(false);
        });

        var del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete saved title");
        del.addEventListener("click", function (e) {
          e.stopPropagation();
          cfg.bank = cfg.bank.filter(function (t) { return t !== title; });
          persist();
          render();
        });

        row.appendChild(pick);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function setOpen(open) {
      wrap.classList.toggle("open", open);
      if (open) render();
    }

    enableReorder(list, render);

    toggleBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setOpen(!wrap.classList.contains("open"));
    });

    // save the typed title to the bank right away (no need to start the timer)
    var flashTimer = 0;
    addBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!input.value.trim()) return;
      saveToBank(input.value);
      if (wrap.classList.contains("open")) render();
      addBtn.textContent = "✓";
      addBtn.classList.add("saved");
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () {
        addBtn.textContent = "＋";
        addBtn.classList.remove("saved");
      }, 900);
    });

    return { render: render, setOpen: setOpen };
  }

  var setupTitle = makeTitleField(
    $("titleWrap"), labelInput, $("bankList"), $("bankAdd"), $("bankToggle"),
    {
      onPick: function (title) { cfg.label = title; persist(); },
      closeOnPick: true
    }
  );

  // The console list stays open after a pick so titles can be flipped
  // one after another without reopening the dropdown mid-service.
  var opTitle = makeTitleField(
    $("opTitleWrap"), $("opLabelInput"), $("opBankList"), $("opBankAdd"), $("opBankToggle"),
    {
      onPick: function (title) { setLabel(title); },
      isActive: function (title) { return title === T.label; }
    }
  );

  // tap anywhere else closes an open dropdown
  document.addEventListener("click", function (e) {
    if (!$("titleWrap").contains(e.target)) setupTitle.setOpen(false);
    if (!$("opTitleWrap").contains(e.target)) opTitle.setOpen(false);
  });

  // ============================================================
  //  Operator: the console
  // ============================================================
  var opLabelInput = $("opLabelInput");
  var previewBox = $("previewBox"), opBody = $("opBody");
  var playBtn = $("playBtn"), flashBtn = $("flashBtn");
  var nextMin = $("nextMin"), nextSec = $("nextSec");
  var controlsEl = $("controls"), opGrid = document.querySelector(".op-grid");
  var soloOverlay = $("soloOverlay"), drawer = $("drawer");
  var drawerTab = $("drawerTab"), drawerBody = $("drawerBody");
  var labelZone = $("labelZone"), labelEdit = $("labelEdit");

  function commit() {
    renderStage();
    playBtn.textContent = T.playing ? "❚❚" : "▶";
    flashBtn.classList.toggle("on", !!T.flashing);
    soloOverlay.classList.toggle("paused", !T.playing);
    broadcast();
  }

  function setLabel(v) {
    T.label = v;
    cfg.label = v;
    persist();
    if (opLabelInput.value !== v) opLabelInput.value = v;
    commit();
    opTitle.render();
  }

  function setPlaying(p) {
    if (p === T.playing) return;
    if (p) T.endAt = now() + T.remainMs;
    else T.remainMs = T.endAt - now();
    T.playing = p;
    commit();
  }

  function adjust(ms) {
    if (T.playing) T.endAt += ms;
    else T.remainMs += ms;
    commit();
  }

  function armTimer(totalMs, play) {
    T.totalMs = totalMs;
    T.remainMs = totalMs;
    T.endAt = now() + totalMs;
    T.playing = !!play;
    commit();
  }

  $("startBtn").addEventListener("click", function () {
    cfg.label = labelInput.value.trim();  // empty = show no title on stage
    labelInput.value = cfg.label;
    saveToBank(cfg.label);
    setupTitle.setOpen(false);
    persist();

    T.label = cfg.label;
    T.swapped = false;
    T.flashing = false;
    T.live = true;
    opLabelInput.value = cfg.label;
    nextMin.value = cfg.minutes;
    nextSec.value = pad2(cfg.seconds);

    if (role === "solo") {
      enterSolo();
    } else {
      show("opScreen");
      mountStage(previewBox, false);
    }
    armTimer((cfg.minutes * 60 + cfg.seconds) * 1000, true);
  });

  function stopTimer() {
    T.live = false;
    T.playing = false;
    T.flashing = false;
    commit();
    show("setup");
    renderSetup();
  }

  $("opExit").addEventListener("click", stopTimer);

  // ---- standalone: the controls and settings panels move onto the stage ----
  function enterSolo() {
    document.body.classList.add("solo-mode");
    show("");
    stageWrap.classList.add("full");
    mountStage(stageWrap, true);
    controlsEl.classList.add("floating");
    soloOverlay.appendChild(controlsEl);
    opGrid.classList.add("stacked");
    drawerBody.appendChild(opGrid);
    setDrawer(false);
    soloOverlay.classList.add("on");
    requestWakeLock();
  }

  function leaveSolo() {
    setDrawer(false);
    soloOverlay.classList.remove("on");
    document.body.classList.remove("solo-mode");
    controlsEl.classList.remove("floating");
    opGrid.classList.remove("stacked");
    labelZone.classList.remove("editing");
    stageWrap.classList.remove("full");
    stageWrap.style.display = "none";
    opBody.appendChild(controlsEl);   // restores previewBox / controls / grid
    opBody.appendChild(opGrid);
    releaseWakeLock();
  }

  $("soloExit").addEventListener("click", function () {
    leaveSolo();
    stopTimer();
  });

  function setDrawer(open) {
    drawer.classList.toggle("open", open);
    drawerTab.textContent = open ? "›" : "‹";
  }

  drawerTab.addEventListener("click", function (e) {
    e.stopPropagation();
    setDrawer(!drawer.classList.contains("open"));
  });

  // ---- tap the title on stage to retype it, timer keeps running ----
  function growLabelEdit() {
    labelEdit.style.height = "auto";
    labelEdit.style.height = labelEdit.scrollHeight + "px";
  }

  labelZone.addEventListener("click", function (e) {
    if (!document.body.classList.contains("solo-mode")) return;
    if (labelZone.classList.contains("editing")) return;
    e.stopPropagation();
    labelEdit.value = T.label;
    labelZone.classList.add("editing");
    growLabelEdit();
    labelEdit.focus();
    labelEdit.select();
  });

  labelEdit.addEventListener("input", growLabelEdit);
  labelEdit.addEventListener("blur", function () {
    var v = labelEdit.value.trim();   // clearing it removes the title from stage
    labelZone.classList.remove("editing");
    saveToBank(v);
    setLabel(v);
  });
  labelEdit.addEventListener("keydown", function (e) {
    e.stopPropagation();              // Enter adds a line; tap outside to finish
    if (e.key === "Escape") { labelEdit.value = T.label; labelEdit.blur(); }
  });

  $("restartBtn").addEventListener("click", function () { armTimer(T.totalMs, false); });
  $("minusBtn").addEventListener("click", function () { adjust(-60000); });
  $("plusBtn").addEventListener("click", function () { adjust(60000); });
  playBtn.addEventListener("click", function () { setPlaying(!T.playing); });
  $("swapBtn").addEventListener("click", function () { T.swapped = !T.swapped; commit(); });
  flashBtn.addEventListener("click", function () { T.flashing = !T.flashing; commit(); });

  opLabelInput.addEventListener("input", function () { setLabel(opLabelInput.value); });
  opLabelInput.addEventListener("keydown", function (e) { e.stopPropagation(); });

  document.querySelectorAll("[data-nstep]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var d = Number(btn.dataset.d);
      if (btn.dataset.nstep === "min") {
        nextMin.value = Math.min(180, Math.max(0, (Number(nextMin.value) || 0) + d));
      } else {
        nextSec.value = pad2(((Number(nextSec.value) || 0) + d * 5 + 60) % 60);
      }
    });
  });

  [nextMin, nextSec].forEach(function (input) {
    input.addEventListener("focus", function () { input.select(); });
    input.addEventListener("input", function () {
      var v = input.value.replace(/\D/g, "");
      if (v !== input.value) input.value = v;
    });
    input.addEventListener("keydown", function (e) {
      e.stopPropagation();
      if (e.key === "Enter") input.blur();
    });
  });

  $("applyTimeBtn").addEventListener("click", function () {
    cfg.minutes = Math.min(180, Math.max(0, Number(nextMin.value) || 0));
    cfg.seconds = Math.min(59, Number(nextSec.value) || 0);
    persist();
    renderSetup();
    armTimer((cfg.minutes * 60 + cfg.seconds) * 1000, true);
    setDrawer(false);
  });

  // ----- wake lock (keeps the screen on while the timer runs) -----
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (wl) {
      wakeLock = wl;
    }).catch(function () {});
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    var onStage = document.body.classList.contains("display-mode") ||
                  document.body.classList.contains("solo-mode");
    if (document.visibilityState === "visible" && onStage) requestWakeLock();
  });

  // ----- keyboard shortcuts on the operator console -----
  document.addEventListener("keydown", function (e) {
    var driving = (role === "op" && $("opScreen").classList.contains("on")) ||
                  (role === "solo" && document.body.classList.contains("solo-mode"));
    if (!driving) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!T.playing); }
    else if (e.key === "ArrowUp") { e.preventDefault(); adjust(60000); }
    else if (e.key === "ArrowDown") { e.preventDefault(); adjust(-60000); }
    else if (e.key === "r" || e.key === "R") armTimer(T.totalMs, false);
    else if (e.key === "f" || e.key === "F") { T.flashing = !T.flashing; commit(); }
    else if (e.key === "s" || e.key === "S") { T.swapped = !T.swapped; commit(); }
  });

  window.addEventListener("beforeunload", destroyPeer);

  // ----- boot -----
  function showDisplayURL(urls) {
    var list = $("urlList");
    list.textContent = "";
    if (!urls.length) {
      var warn = document.createElement("div");
      warn.className = "url-none";
      warn.textContent = "No network found. Turn on Mobile Hotspot, then restart the server window.";
      list.appendChild(warn);
      return;
    }
    urls.forEach(function (u) {
      var row = document.createElement("div");
      row.className = "url-item";
      row.textContent = u.url;
      list.appendChild(row);
    });
  }

  function applyTransportUI() {
    $("roomRow").hidden = LOCAL;
    $("urlRow").hidden = !LOCAL;
  }

  renderSetup();
  renderStage();
  show("menu");

  // Hold the role buttons until we know which transport this page has, so a
  // fast tap cannot start the wrong one.
  $("pickOp").disabled = true;
  $("pickDisp").disabled = true;
  detectLocal(function (isLocal) {
    LOCAL = isLocal;
    applyTransportUI();
    $("pickOp").disabled = false;
    $("pickDisp").disabled = false;
  });
})();
</script>
</body>
</html>
